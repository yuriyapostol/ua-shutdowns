<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Графік відключень світла — UA Shutdowns</title>
  <link rel="stylesheet" href="popup.css">
  <script src="dtek-sites.js" defer></script>
  <script src="address-settings.js" defer></script>
  <script src="address-navigation.js" defer></script>
  <script src="popup.js" defer></script>
</head>
<body>
  <main>
    <header>
      <img src="images/icon-48.png" width="32" height="32" alt="">
      <div><p class="brand">UA Shutdowns</p><h1 id="screen-title">Графік відключень світла</h1></div>
    </header>
    <button id="nav-back" class="back" type="button" hidden>← До адрес</button>
    <section id="home-view" aria-labelledby="screen-title">
      <div id="address-list"></div>
      <p id="empty-state" class="empty" hidden>Додайте адресу, щоб відкривати її графік відключень одним натисканням.</p>
      <div class="home-actions">
        <button id="add-address" type="button" disabled>Додати адресу</button>
        <button id="open-settings" class="secondary" type="button" disabled>Налаштування</button>
      </div>
    </section>
    <section id="form-view" aria-labelledby="screen-title" hidden>
      <form id="address-form">
        <fieldset id="address-fields" disabled>
          <label for="region">Регіональне представництво</label>
          <select id="region" name="region" required><option value="">Оберіть представництво</option></select>
          <label for="city">Місто / населений пункт</label>
          <input id="city" name="city" type="text" required autocomplete="address-level2" placeholder="Введіть населений пункт">
          <label for="street">Вулиця</label>
          <input id="street" name="street" type="text" required autocomplete="address-line1" placeholder="Введіть назву вулиці">
          <label for="house">Будинок</label>
          <input id="house" name="house" type="text" required placeholder="Введіть номер будинку">
          <button type="submit">Зберегти адресу</button>
        </fieldset>
      </form>
      <button id="delete-address" class="danger" type="button" hidden>Видалити адресу</button>
      <div id="delete-confirmation" class="confirmation" hidden>
        <p>Видалити цю адресу зі списку?</p>
        <div class="button-row">
          <button id="confirm-delete" class="danger" type="button">Так, видалити</button>
          <button id="cancel-delete" class="secondary" type="button">Залишити</button>
        </div>
      </div>
    </section>
    <section id="settings-view" aria-labelledby="screen-title" hidden>
      <label class="checkbox-row" for="auto-close-popups">
        <input id="auto-close-popups" name="autoClosePopups" type="checkbox">
        <span>Автоматично закривати спливаючі вікна</span>
      </label>
      <p class="hint">Зміна зберігається одразу й застосовується до всіх регіональних сайтів ДТЕК.</p>
    </section>
    <p id="status" role="status" aria-live="polite">Завантаження…</p>
  </main>
</body>
</html>

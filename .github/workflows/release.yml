name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Verify vendored QR modules
        run: npm run vendor:check
      - name: Run tests
        run: npm test
      - name: Prepare release notes and extension ZIP
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          from scripts.release_notes import render_release_notes

          version = json.loads(Path('manifest.json').read_text())['version']
          if not re.fullmatch(r'\d+\.\d+\.\d+', version) or os.environ['RELEASE_TAG'] != 'v' + version:
              raise SystemExit('Release tag must match manifest.json version')
          notes = render_release_notes(version, Path.cwd())
          (Path(os.environ['RUNNER_TEMP']) / 'release-notes.md').write_text(notes, encoding='utf-8')
          subprocess.run([
              'git', 'archive', '--format=zip', '--output=ua-shutdowns-' + version + '.zip', 'HEAD',
              'manifest.json', 'i18n-catalogs.js', 'i18n.js', 'background.js', 'dtek-sites.js', 'dtek-schedule.js', 'address-settings.js', 'address-identity.js', 'address-navigation.js', 'dtek-content-script.js', 'dtek-popup-closer.js',
              'popup.html', 'popup.css', 'popup.js', 'schedule-sharing.mjs', 'vendor', '_locales', 'images', 'fonts', 'README.md', 'README.uk.md', 'CHANGELOG.md', 'CHANGELOG.uk.md', 'TRANSLATING.md', 'TRANSLATING.uk.md'
          ], check=True)
          PY
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" "ua-shutdowns-${RELEASE_TAG#v}.zip" \
            --verify-tag --title "UA Shutdowns ${RELEASE_TAG#v}" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
